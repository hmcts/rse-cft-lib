name: Auto-Tag & publish

on:
  push:
    branches: [main]

# Grant permissions for creating and pushing tags
permissions:
  contents: write

env:
  RELEASE_SERIES: '0.20'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # Need full history for tags

      - name: Calc Version, Tag & Push
        id: version_tag
        run: |
          LATEST_TAG=$(git tag --list "${RELEASE_SERIES}.*" --sort=-version:refname | awk -F. 'NF == 3 && $3 ~ /^[0-9]+$/ { print }' | sed -n '1p')
          if [ -z "$LATEST_TAG" ]; then
            echo "::notice::Automatic publication paused: ${RELEASE_SERIES}.0 is a breaking release. Complete the consumer migration review, then create the initial release tag explicitly."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEXT_PATCH=$(echo "$LATEST_TAG" | awk -F. '{ print $3+1 }')
          NEXT_VERSION="${RELEASE_SERIES}.${NEXT_PATCH}"

          # Set the calculated version as a step output
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

          git tag "$NEXT_VERSION"
          git push origin "$NEXT_VERSION"
        shell: bash

      - uses: actions/setup-java@v4
        if: steps.version_tag.outputs.publish == 'true'
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Publish Artifact
        if: steps.version_tag.outputs.publish == 'true'
        run: |
          (cd cftlib; ./gradlew -is publishToAzureArtifacts)
        env:
          AZURE_DEVOPS_ARTIFACT_USERNAME: ${{ secrets.AZURE_DEVOPS_ARTIFACT_USERNAME }}
          AZURE_DEVOPS_ARTIFACT_TOKEN: ${{ secrets.AZURE_DEVOPS_ARTIFACT_TOKEN }}
          RELEASE_VERSION: ${{ steps.version_tag.outputs.next_version }}
        shell: bash
