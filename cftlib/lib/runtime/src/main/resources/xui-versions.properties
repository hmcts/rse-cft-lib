# The XUI revisions cftlib builds and runs when it is not using the published docker images.
#
# ref must be a commit sha, a tag or a branch; a sha is fetched directly so that a boot is
# reproducible. node is the engines.node range of that revision's package.json and is checked
# against the host's node before anything is cloned.
#
# Each value can be overridden for a single task with the matching environment variable:
# RSE_LIB_XUI_REPO, RSE_LIB_XUI_REF, RSE_LIB_XUI_NODE_RANGE for manage cases and
# RSE_LIB_XUI_MO_REPO, RSE_LIB_XUI_MO_REF, RSE_LIB_XUI_MO_NODE_RANGE for manage organisations.

manage-cases.repo=https://github.com/hmcts/rpx-xui-webapp.git
manage-cases.ref=4d344f6ff7815ecf507a9db38667be6a7cf8d375
manage-cases.node=>=24.22.1

manage-org.repo=https://github.com/hmcts/rpx-xui-manage-organisations.git
manage-org.ref=1261fd832c3903c3629022d0890cee35dd6ae492
manage-org.node=>=24.22.1 <25
