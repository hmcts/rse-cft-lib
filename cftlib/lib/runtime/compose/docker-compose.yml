---
version: '3.5'
services:
  shared-database-pg:
    image: postgres:${POSTGRES_VERSION:-16}
    environment:
      DB_USERNAME:
      DB_PASSWORD:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - ${RSE_LIB_DB_PORT:-6432}:5432
  ccd-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.4
    environment:
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx400m
      - ES_JAVA_OPTS=-Xms128m -Xmx400m
      - cluster.name=ccd-docker-es-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - action.auto_create_index=.security*,.watches,.triggered_watches,.watcher-history-*,.logstash_dead_letter,.ml*,*_cases,global_search
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - 9200:9200

  xui-manage-cases:
    image: "${XUI_MANAGE_CASES_USE_LOCAL-hmctsprod.azurecr.io/}xui/webapp:${XUI_MANAGE_CASES_TAG:-latest}"
    env_file:
      - ./xui.env
    environment:
      FEATURE_APP_INSIGHTS_ENABLED: "false"
      FEATURE_SECURE_COOKIE_ENABLED: "false"
      FEATURE_REDIS_ENABLED: "false"
      JURISDICTIONS: "${XUI_JURISDICTIONS:-DIVORCE,PROBATE,SSCS,PRIVATELAW,PUBLICLAW,ADOPTION,CIVIL,EMPLOYMENT}"
      MICROSERVICE: xui_webapp
      PROTOCOL: http
      XUI_ENV: local
      DEBUG: '*:*'
      SERVICES_DOCUMENTS_API: "${XUI_DOCUMENTS_API:-http://dm-store-aat.service.core-compute-aat.internal}"
      SERVICES_DOCUMENTS_API_V2: "${XUI_DOCUMENTS_API_V2:-http://host.docker.internal:4455}"

      SERVICES_PAYMENTS_URL: http://payment-api-aat.service.core-compute-aat.internal
      SERVICES_EM_ANNO_API: http://${JVM_HOST:-host.docker.internal}:4452
      SERVICES_CCD_COMPONENT_API: http://${JVM_HOST:-host.docker.internal}:4452
      SERVICES_CCD_DATA_STORE_API: http://${JVM_HOST:-host.docker.internal}:4452
      SERVICES_CCD_CASE_ASSIGNMENT_API: http://${JVM_HOST:-host.docker.internal}:4454
      SERVICES_IDAM_API_URL: "${XUI_IDAM_API_URL:-https://idam-api.aat.platform.hmcts.net}"
      SERVICES_IDAM_CLIENT_ID: xuiwebapp
      SERVICES_IDAM_LOGIN_URL: "${XUI_IDAM_LOGIN_URL:-https://idam-web-public.aat.platform.hmcts.net}"
      SERVICES_IDAM_INDEX_URL: /
      SERVICES_IDAM_OAUTH_CALLBACK_URL: /oauth2/callback
      SERVICES_EM_DOCASSEMBLY_API: "${XUI_EM_DOCASSEMBLY_API:-http://dg-docassembly-aat.service.core-compute-aat.internal}"
      HEALTH_EM_DOCASSEMBLY_API: "${XUI_EM_DOCASSEMBLY_API:-http://dg-docassembly-aat.service.core-compute-aat.internal}/health"
      SERVICES_S2S: "${XUI_S2S_URL:-http://rpe-service-auth-provider-aat.service.core-compute-aat.internal}"
      SYSTEM_USER_NAME: "${XUI_SYSTEM_USER_NAME:-cwd_system@mailinator.com}"
      SYSTEM_USER_PASSWORD: "${XUI_SYSTEM_USER_PASSWORD:-password}"
      REDISCLOUD_URL: http://localhost:6780
      HEALTH_CCD_COMPONENT_API: http://${JVM_HOST:-host.docker.internal}:4452/health
      HEALTH_CCD_DATA_API: http://${JVM_HOST:-host.docker.internal}:4452/health
      SERVICES_PRD_API: "${RD_PROFESSIONAL_API_URL:-http://rd-professional-api-aat.service.core-compute-aat.internal}"
      APPINSIGHTS_INSTRUMENTATIONKEY: TESTVAR
      APPINSIGHTS_CONNECTION_STRING: "InstrumentationKey=dummy-key;IngestionEndpoint=https://uksouth-0.in.applicationinsights.azure.com/"
      IDAM_SECRET: "${XUI_OAUTH_SECRET:-AAAAAAAAAAAAAAA}"
      S2S_SECRET: "${XUI_SERVICE_KEY:-AAAAAAAAAAAAAAAA}"
      SESSION_SECRET: "${XUI_SESSION_SECRET:-secretSauce}"
      LAUNCH_DARKLY_CLIENT_ID: "${XUI_LD_ID:-5de6610b23ce5408280f2268}"
      SERVICES_ROLE_ASSIGNMENT_API: http://${JVM_HOST:-host.docker.internal}:4096
      HEALTH_ROLE_ASSIGNMENT_API: http://${JVM_HOST:-host.docker.internal}:4096/health
      SERVICES_PRD_COMMONDATA_API: "${SERVICES_PRD_COMMONDATA_API:-http://rd-commondata-api-aat.service.core-compute-aat.internal}"
      SERVICES_PRD_LOCATION_API: "${SERVICES_PRD_LOCATION_API:-http://rd-location-ref-api-aat.service.core-compute-aat.internal}"
      SERVICES_PRD_JUDICIAL_API: "${SERVICES_PRD_JUDICIAL_API:-http://rd-judicial-api-aat.service.core-compute-aat.internal}"
      SERVICES_CASE_CASEWORKER_API: "${SERVICES_CASE_CASEWORKER_API:-http://rd-caseworker-ref-api-aat.service.core-compute-aat.internal}"
      SERVICES_CASE_JUDICIAL_API: "${SERVICES_CASE_JUDICIAL_API:-http://rd-judicial-api-aat.service.core-compute-aat.internal}"
      SERVICES_CASE_JUDICALWORKER_API: "${SERVICES_CASE_JUDICALWORKER_API:-http://rd-judicial-ref-api-aat.service.core-compute-aat.internal}"
      SERVICES_LOCATION_API: "${SERVICES_LOCATION_API:-http://rd-location-ref-api-aat.service.core-compute-aat.internal}"
      SERVICES_WORK_ALLOCATION_TASK_API: "${SERVICES_WORK_ALLOCATION_TASK_API:-http://wa-task-management-api-aat.service.core-compute-aat.internal}"
      HEALTH_WORK_ALLOCATION_TASK_API: "${SERVICES_WORK_ALLOCATION_TASK_API:-http://wa-task-management-api-aat.service.core-compute-aat.internal}/health"
      SERVICES_LOCATION_REF_API_URL: "${SERVICES_LOCATION_REF_API_URL:-http://rd-location-ref-api-aat.service.core-compute-aat.internal}"
      FEATURE_WORKALLOCATION_ENABLED: ${FEATURE_WORKALLOCATION_ENABLED:-false}
      WA_SUPPORTED_JURISDICTIONS: "${WA_SUPPORTED_JURISDICTIONS:-IA,CIVIL,PRIVATELAW,PUBLICLAW,EMPLOYMENT,ST_CIC}"
      SERVICES_HMC_HEARINGS_COMPONENT_API: "${XUI_SERVICES_HMC_HEARINGS_COMPONENT_API:-http://hmc-cft-hearing-service-aat.service.core-compute-aat.internal}"
      SERVICES_HEARINGS_COMPONENT_API_PRIVATELAW: "${XUI_SERVICES_HEARINGS_COMPONENT_API_PRIVATELAW:-http://fis-hmc-api-aat.service.core-compute-aat.internal}"
      SERVICES_JUDICIAL_BOOKING_API_PATH: "${SERVICES_JUDICIAL_BOOKING_API_PATH:-http://am-judicial-booking-service-aat.service.core-compute-aat.internal}"
    ports:
      - ${XUI_PORT:-3000}:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"

  xui-manage-org:
    image: hmctsprod.azurecr.io/xui/mo-webapp:latest
    environment:
      DEBUG: '*:*'
      IDAM_API_SERVICE: "${XUI_IDAM_API_URL:-https://idam-api.aat.platform.hmcts.net}"
      IDAM_WEB_SERVICE: "${XUI_IDAM_LOGIN_URL:-https://idam-web-public.aat.platform.hmcts.net}"
      RD_PROFESSIONAL_API_SERVICE: "${RD_PROFESSIONAL_API_URL:-http://rd-professional-api-aat.service.core-compute-aat.internal}"
      S2S_SERVICE: "${XUI_S2S_URL:-http://rpe-service-auth-provider-aat.service.core-compute-aat.internal}"
      FEE_AND_PAY_API: http://payment-api-aat.service.core-compute-aat.internal
      SERVICES_CCD_DATA_STORE_API: http://${JVM_HOST:-host.docker.internal}:4452
      SYSTEM_USER_NAME: "${XUI_SYSTEM_USER_NAME:-cwd_system@mailinator.com}"
      SYSTEM_USER_PASSWORD: "${XUI_SYSTEM_USER_PASSWORD:-password}"
      ACA_SERVICE_API_BASEURL: http://${JVM_HOST:-host.docker.internal}:4454
      SERVICES_MCA_PROXY_API: http://${JVM_HOST:-host.docker.internal}:4454
      APPINSIGHTS_INSTRUMENTATIONKEY: "AAAAAAAAAAAAAAAC"
      APPINSIGHTS_CONNECTION_STRING: "InstrumentationKey=dummy-key;IngestionEndpoint=https://uksouth-0.in.applicationinsights.azure.com/"
      IDAM_SECRET: "${XUI_MANAGE_ORG_OAUTH_SECRET:-AAAAAAAAAAAAAAA}"
      S2S_SECRET: "${XUI_SERVICE_KEY:-AAAAAAAAAAAAAAAA}"
      LAUNCH_DARKLY_CLIENT_ID: "${XUI_LD_ID:-5de6610b23ce5408280f2268}"
      APPINSIGHTS_INSTRUMENTATIONKEY_MO: "AAAAAAAAAAAAAAAC"
      GOOGLE_ANALYTICS_KEY: "AAAAAAAAAAAAAAAC"
      REDISCLOUD_URL: "AAAAAAAAAAAAAAAC"
      NODE_CONFIG_ENV: local
      IDAM_CLIENT: xuimowebapp
      MICROSERVICE: xui_webapp
      OAUTH_CALLBACK_URL: /oauth2/callback
      LOGIN_ROLE_MATCHER:
      PROTOCOL: "http"
      SERVICES_TERMS_AND_CONDITIONS_API_SERVICE:
      MANAGE_CASE_LINK:
      MANAGE_ORG_LINK:
      SESSION_SECRET: "${XUI_SESSION_SECRET:-secretSauce}"
      CASE_TYPES: "${XUI_MANAGE_ORGANISATIONS_CASETYPES:-NFD,Caveat,GrantOfRepresentation}"
      FEATURE_APP_INSIGHTS_ENABLED: "false"
      FEATURE_PROXY_ENABLED: "false"
      FEATURE_SECURE_COOKIE_ENABLED: "false"
      FEATURE_TERMS_AND_CONDITIONS_ENABLED: "false"
      FEATURE_HELMET_ENABLED: "false"
      FEATURE_REDIS_ENABLED: "false"
      FEATURE_OIDC_ENABLED: "false"
      LOGGING: debug
      PORT: 3001
    ports:
      - ${XUI_MO_PORT:-3001}:3001

  rse-idam-simulator:
    image: "hmctsprod.azurecr.io/hmcts/rse/rse-idam-simulator:latest"
    profiles: ["localAuth"]
    ports:
      - 5062:5062
    environment:
      SIMULATOR_JWT_ISSUER: "${IDAM_SIMULATOR_BASE_URL:-http://localhost:5062}/o"
      SIMULATOR_OPENID_BASE-URL: "${IDAM_SIMULATOR_BASE_URL:-http://localhost:5062}"
      SIMULATOR_OPENID_BASE-URL-OUTSIDE-NETWORK: "${IDAM_SIMULATOR_BASE_URL_OUTSIDE_NETWORK:-http://localhost:5062}"
      SERVER_PORT: 5062
      JAVA_TOOL_OPTIONS:

  # Camunda engine for services whose business processes run on it, such as civil.
  # Opt in with RSE_LIB_COMPOSE_PROFILES=camunda; cftlib then creates its database.
  camunda:
    image: "${CAMUNDA_IMAGE:-hmctsprod.azurecr.io/camunda/bpm:latest}"
    profiles: ["camunda"]
    ports:
      - ${CAMUNDA_PORT:-8999}:8999
    environment:
      CAMUNDA_DB_HOST: shared-database-pg
      CAMUNDA_DB_PORT: 5432
      CAMUNDA_DB_NAME: camunda
      CAMUNDA_DB_USER_NAME: postgres
      CAMUNDA_DB_PASSWORD: postgres
      CAMUNDA_BPM_DATABASE_SCHEMA_UPDATE: "true"
      # As in preview: services call the engine REST API without S2S.
      CAMUNDA_API_AUTH_ENABLED: "false"
      S2S_URL: http://${JVM_HOST:-host.docker.internal}:${RSE_LIB_S2S_PORT:-8489}
      TASK_MANAGEMENT_API_URL: http://${JVM_HOST:-host.docker.internal}:8087
      # Camunda asks task management to initiate each WA task as it is created, rather than wa-task-monitor
      # looking for new tasks on a schedule.
      WA_INITIATE_TASKS_ON_CREATE_ENABLED: "true"
    depends_on:
      - shared-database-pg
    # Starts before cftlib has created its database, so retry until it has.
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Azure Service Bus emulator, with the entities cftlib writes to servicebus/Config.json.
  # Opt in with the servicebus feature. Clients connect with RSE_LIB_SERVICEBUS_CONNECTION_STRING.
  servicebus:
    image: "${SERVICEBUS_EMULATOR_IMAGE:-mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1}"
    profiles: ["servicebus"]
    # Azure SDKs other than .NET ignore a port in the connection string, so AMQP stays on 5672.
    ports:
      - 5672:5672
      - ${SERVICEBUS_HTTP_PORT:-5300}:5300
    volumes:
      - ./servicebus/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    environment:
      SQL_SERVER: servicebus-sql
      MSSQL_SA_PASSWORD: "${SERVICEBUS_SQL_PASSWORD:-Cftlib-Servicebus-1}"
      ACCEPT_EULA: "Y"
      # A fresh SQL Server takes a while to upgrade its schema on first start.
      SQL_WAIT_INTERVAL: 60
    depends_on:
      - servicebus-sql
    restart: on-failure

  # The emulator's own store. Microsoft publishes it for amd64 only, so Apple Silicon runs it under Rosetta.
  servicebus-sql:
    image: "${SERVICEBUS_SQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04}"
    platform: linux/amd64
    profiles: ["servicebus"]
    environment:
      MSSQL_SA_PASSWORD: "${SERVICEBUS_SQL_PASSWORD:-Cftlib-Servicebus-1}"
      ACCEPT_EULA: "Y"
