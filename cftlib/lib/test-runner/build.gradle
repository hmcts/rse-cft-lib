
dependencies {
    compileOnly 'org.springframework.security:spring-security-config:5.4.7'
    compileOnly 'javax.servlet:javax.servlet-api:4.0.1'
    compileOnly 'org.aspectj:aspectjweaver:1.9.7'
    // Will be put on the runtime classpath by the gradle plugin.
    compileOnly project(':lib:bootstrapper')

    implementation 'org.junit.jupiter:junit-jupiter-api:5.12.2'
    // Do not use the standalone jar: its embedded Platform classes cannot be aligned by consuming builds.
    implementation 'org.junit.platform:junit-platform-console:1.12.2'
    implementation 'com.auth0:java-jwt:3.18.3'
}
